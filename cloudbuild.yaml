# Build the image and put it live on Cloud Run.
#
# Google runs this, not GitHub, which is deliberate: a Cloud Build trigger reads
# the repository directly, so there is no service account key sitting in a
# GitHub secret waiting to leak. Nothing here is a credential.
#
# NOT IN USE YET. This is written, tested and ready, and nothing runs it: Cloud
# Run needs a billing account, and Google would not accept a card. Until that
# changes the app stays on Render and the waking-up page is avoided by keeping
# the instance from ever sleeping — see .github/workflows/keepwarm.yml.
#
# ONE-TIME SETUP, in the Google Cloud console:
#
#   1. Create a project, and enable billing on it. Cloud Run's free tier is
#      real and permanent, but Google still wants a card on the account. Set a
#      budget alert while you are there.
#
#   2. Enable these APIs: Cloud Run, Cloud Build, Artifact Registry.
#
#   3. Artifact Registry, Create Repository:
#        name: trustfirst      format: Docker      region: europe-west1
#
#   4. Cloud Build, Triggers, Connect Repository, pick this GitHub repo, then
#      Create Trigger:
#        event: push to branch      branch: ^main$
#        configuration: Cloud Build configuration file      location: cloudbuild.yaml
#
#   5. Give the build permission to deploy. In IAM, find the Cloud Build service
#      account and add: Cloud Run Admin, and Service Account User.
#
#   6. Set the environment variables on the Cloud Run service itself, in the
#      console, not here. They are secrets and they do not belong in a file that
#      lives in the repository.
#
#      Everything the app already needed carries over from Render unchanged.
#      Three are new or newly important:
#
#        APP_PUBLIC_URL        https://app.gettrustfirst.co.za
#                              The one place the app's own address is written
#                              down. It puts the host in ALLOWED_HOSTS, the
#                              origin in CSRF_TRUSTED_ORIGINS, and it is what
#                              the Yoco webhook is registered against.
#        ALLOWED_HOSTS         only needed for a host that is neither the
#                              APP_PUBLIC_URL one nor a *.run.app address.
#
#      SECURE_SSL_REDIRECT does not need setting. settings.py turns it on by
#      itself when it sees K_SERVICE, which only Cloud Run sets. Set it to
#      False there if you ever need the app to answer on http.
#
#      RENDER_EXTERNAL_HOSTNAME is not set here and does not need to be. Nothing
#      on Cloud Run sets it, and settings.py only reads it so a rollback works.
#
#   7. Point the domain at the service. Cloud Run, Manage Custom Domains, Add
#      Mapping: pick the service, enter app.gettrustfirst.co.za, and add the DNS
#      records it prints at the registrar. Google issues the certificate. Until
#      that resolves the service is still reachable at its own *.run.app
#      address, which settings.py already allows.
#
#   8. Keep one instance alive, so nobody waits for a cold start.
#
#      min-instances stays at 0 below because a minimum instance is billed
#      around the clock and would leave the free tier within days. Pinging
#      /healthz instead costs nothing: Cloud Run only charges CPU while a
#      request is being served, so an instance that is merely alive between
#      pings is free, and 4,000-odd pings a month is nothing against the two
#      million included.
#
#      Cloud Scheduler, Create Job (three jobs are free per month):
#        frequency: */10 * * * *      target: HTTP
#        URL: https://app.gettrustfirst.co.za/healthz      method: GET
#
#      .github/workflows/keepwarm.yml already does this from GitHub Actions, but
#      it is pointed at Render, which is where the app still runs. Repoint its
#      APP_URL when you cut over, and widen its schedule while you are there:
#      the narrow window exists only because Render bills free usage by the hour
#      and suspends everything when the 750 run out. Cloud Run bills per request,
#      so there is no reason to let it sleep at all.
#
# After that, pushing to main builds and deploys itself, the same way the
# landing site already does.
#
# WHY NOT THE OTHER FREE GOOGLE OPTION. App Engine's standard tier includes 28
# instance-hours a day, enough to keep one instance up permanently with no cold
# start at all — but the free instance class has 256MB of memory, and this app
# handles images and video and was already pushing past that on Render's 512MB.
# Cloud Run at 1GB with a warm instance gets the same result with room to work.

substitutions:
  _REGION: europe-west1          # closest of the cheap regions to South Africa
  _SERVICE: trustfirst
  _REPO: trustfirst

steps:
  # Built with the commit's short SHA as the tag, so every deploy is traceable
  # back to exactly one commit, and rolling back is picking an older tag rather
  # than reverting code under pressure.
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # Deployed without --set-env-vars on purpose. Those are configured once on the
  # service and left alone; naming them here would mean every deploy silently
  # overwrote whatever was set in the console, including the payment keys.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # The app is a public website. Without this only signed-in Google
      # accounts could reach it, which would look like a total outage.
      - --allow-unauthenticated
      # 1GB, twice what the old free instance had. Video work and image
      # handling were running into the old ceiling.
      - --memory=1Gi
      - --cpu=1
      # Scales to zero, so an idle app costs nothing. The ceiling is a
      # deliberate guard: a traffic spike or a runaway loop cannot quietly
      # spend money that this project does not have.
      - --min-instances=0
      - --max-instances=4
      # Each instance handles many requests at once, which is what keeps a
      # Django app comfortably inside the free tier.
      - --concurrency=80
      - --timeout=300
      # Extra CPU while the container is starting, billed at nothing extra and
      # switched on per service. Combined with gunicorn --preload it is what
      # turns a cold start into a pause nobody names, which is the whole reason
      # this app is not on Render any more.
      - --cpu-boost

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
