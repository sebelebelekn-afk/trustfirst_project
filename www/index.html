<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrustFirst</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
    h1 { font-size: 26px; font-weight: 900; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.66); margin: 0 0 22px; max-width: 320px; }
    button { background: #007AFF; color: #fff; border: none; border-radius: 26px;
      padding: 14px 30px; font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <!-- Shown only if the app cannot reach the TrustFirst servers. Normally the
       native shell loads the live site configured in capacitor.config.json. -->
  <div class="wrap">
    <h1>TrustFirst</h1>
    <p>We could not reach TrustFirst. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
