name: Keep the app warm

# Why this exists: so nobody ever meets Render's "service waking up" page.
#
# That page is Render's, not ours, and no code in this repo can suppress it.
# What it can do is make sure the service is never asleep when somebody knocks.
# Render spins a free service down after 15 minutes without traffic, so a
# request every 10 minutes means it never goes idle long enough to stop, and
# the page never gets a chance to appear.
#
# THE QUOTA IS THE WHOLE DESIGN. A free workspace gets 750 instance-hours a
# month, and spun-down time does not count against them. Running flat out for a
# 31-day month is 744 hours, which fits — but with six hours to spare, and if
# the allowance runs out Render SUSPENDS EVERY FREE SERVICE until the 1st.
# That is a total outage, far worse than the page this is meant to avoid.
#
# WHY EACH RUN LOOPS INSTEAD OF FIRING ONCE. GitHub's scheduled runs are
# best-effort and routinely start ten to thirty minutes late when the runners
# are busy. Against a fifteen-minute idle timeout that is a race this loses:
# a single ping per cron tick means the app spins down in every gap, which is
# exactly what happened when this file pinged once and went home.
#
# So cron only has to start a run roughly on the hour, and the run itself keeps
# time from there — pinging every five minutes for seventy, which is longer
# than the hour between runs. A run that starts twenty minutes late is still
# covered by the one before it. concurrency below then hands over cleanly: the
# new run cancels the old one rather than both pinging.
#
# This costs nothing because the repository is public, and GitHub bills no
# minutes for Actions on public repositories. Do not carry this file into a
# private repo without rereading that: continuous runs would eat the 2,000
# free minutes a month in about a day and a half.
#
#   pings   04:00-01:09 UTC, every 5 minutes
#   asleep  roughly 01:25-04:00 UTC  =  03:25-06:00 SAST
#   usage   about 664 hours a month, leaving ~86 in hand
#
# THE GAP IS NOT DOWNTIME. The app answers every request during it. All the gap
# decides is who pays for the wake-up — this ping, or the first visitor. And a
# real visitor keeps the instance up for the next 15 minutes just as well as a
# ping does, so at most one person waits, and only when the app was quiet
# enough that almost nobody was there to wait.
#
# The gap sits at 01:25-04:00 UTC, the least-bad slot for an audience that is
# mostly South African but not only: pre-dawn in Johannesburg, the middle of
# the night in Europe, late evening into early morning across the Americas. It
# is the working day in Asia, which is the cost of the choice rather than
# something a schedule can solve. Shift the hours below if the users turn out
# to sit somewhere else — the shape matters more than the exact slot, and
# Render's dashboard shows where the hours actually go.
#
# ONE FREE SERVICE ONLY. The 750 hours belong to the workspace, not the
# service. A second free web service running alongside this one halves the
# budget and both get suspended when it runs out.
#
# IF THIS EVER RUNS OUT ANYWAY, that is information, not a bug: it means real
# traffic is keeping the instance up around the clock on its own, which is 744
# hours before this file pings anything. An app genuinely busy at every hour
# has outgrown a 750-hour allowance and needs a host that charges by the
# request instead — which is what cloudbuild.yaml is already written for.
#
# IF THE APP MOVES OFF RENDER, change APP_URL below and drop the gap entirely:
# on a host that bills per request rather than per hour, an idle instance costs
# nothing and there is no reason to let it sleep at all.

on:
  schedule:
    # On the hour, every hour except 01:00-03:00 UTC. The run itself does the
    # fine-grained pinging, so this only has to start one roughly on time.
    # Times are UTC; South Africa is UTC+2 year round, no daylight saving.
    - cron: "0 0,4-23 * * *"
  # Every deploy restarts the service, so warm it again straight away rather
  # than leaving the next visitor to pay for it. This also means the loop
  # starts working the moment this file lands, instead of waiting however long
  # GitHub takes to register a new schedule — which is why nothing ran at all
  # the first time round.
  push:
    branches: [main]
  # So it can be fired by hand to check it works, rather than waiting.
  workflow_dispatch:

# No repository permissions at all. This job reads one public URL and writes
# nothing, so the token it gets should be able to do nothing either.
permissions: {}

# A run that overlaps the next one keeps nothing extra warm.
concurrency:
  group: keepwarm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Longer than the gap between runs, so a late start is covered by the run
    # before it. The hard cap is a little above that so a wedged loop cannot
    # sit on a runner indefinitely.
    timeout-minutes: 75
    steps:
      - name: Hold the service open
        env:
          APP_URL: https://trustfirst-project-bt1h.onrender.com
          MINUTES: "70"
          EVERY: "300"          # seconds between pings; the idle timeout is 900
        run: |
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          ok=0; fail=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # /healthz is the cheapest endpoint in the app: no database, no
            # session, no template. See core/views.py. Falling back to / keeps
            # this working if it is ever pinged before that deploy lands.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/healthz") || code=000
            if [ "$code" = "404" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/") || code=000
            fi

            # --max-time is generous on purpose. If the service HAS gone cold
            # this ping is the one paying for the wake-up, which is exactly its
            # job; cutting it off early would mean never succeeding at it.
            case "$code" in
              2*|3*) ok=$((ok+1)) ;;
              *) fail=$((fail+1)); echo "$(date -u +%H:%M:%S) -> $code" ;;
            esac

            # Don't start another sleep we would only be cut off in the middle
            # of; the next run takes over from here.
            [ $(( $(date +%s) + EVERY )) -lt "$deadline" ] || break
            sleep "$EVERY"
          done

          echo "$ok answered, $fail did not"

          # One failed ping is a blip and the next one covers it. Never getting
          # an answer at all means the app is genuinely down and worth a look.
          if [ "$ok" -eq 0 ]; then
            echo "::error::$APP_URL never answered in $MINUTES minutes"
            exit 1
          fi
