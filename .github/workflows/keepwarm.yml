name: Keep the app warm

# The reason this file exists.
#
# Cloud Run scales to zero, which is what makes it free, and the cost of that is
# that the first visitor after a quiet spell waits for a container to start.
# That wait is a second or two rather than Render's minute-long branded holding
# page, but it is still a wait, and it is avoidable for nothing.
#
# Cloud Run bills CPU only while a request is being served. An instance that is
# alive but idle costs nothing at all. So knocking on the door every ten minutes
# keeps one instance up permanently and stays inside the free tier: roughly
# 4,300 requests a month against the two million included, and no CPU beyond the
# few milliseconds each ping actually takes.
#
# /healthz is deliberately the cheapest endpoint in the app — no database, no
# session, no template. See core/views.py.
#
# EITHER THIS OR CLOUD SCHEDULER, NOT BOTH. Cloud Scheduler is the better of the
# two: its free tier covers three jobs, it fires on time, and it does not stop
# because nobody pushed to the repository. GitHub disables scheduled workflows
# on a repository with no activity for sixty days, and its cron is best-effort —
# a run can be held back well past ten minutes when the runners are busy. Set up
# whichever you prefer; the setup notes in cloudbuild.yaml cover Scheduler.
#
# Nothing here is a secret. The URL is the public address of a public website,
# so it lives in the file rather than in repository settings where it would be
# invisible to anyone reading this.

on:
  schedule:
    # Every ten minutes. Cloud Run keeps an idle instance for roughly fifteen
    # before reclaiming it, so this leaves margin for a late run without
    # pinging so often that it looks like traffic.
    - cron: "*/10 * * * *"
  # So it can be fired by hand to check it works, rather than waiting.
  workflow_dispatch:

# No repository permissions at all. This job reads one public URL and writes
# nothing, so the token it gets should be able to do nothing either.
permissions: {}

# A run that overlaps the next one keeps nothing extra warm.
concurrency:
  group: keepwarm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Knock on the door
        env:
          APP_URL: https://app.gettrustfirst.co.za
        run: |
          # --max-time is generous on purpose: if the instance HAS gone cold,
          # this ping is the cold start, and cutting it off early would mean
          # never succeeding at the one thing this job is for.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$APP_URL/healthz") || code=000
          echo "$APP_URL/healthz -> $code"

          # Anything that answers has an instance running, which is the goal.
          # The job only fails when nothing answered at all, so a red run here
          # means the app is genuinely unreachable and is worth looking at.
          case "$code" in
            2*|3*) exit 0 ;;
            *) echo "::warning::No usable response from $APP_URL/healthz (got $code)"; exit 1 ;;
          esac
