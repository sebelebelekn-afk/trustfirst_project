name: Build Android APK

# The dev machine has no JDK and very little free RAM, so a local Gradle build
# would fail. GitHub's runners build it for free instead, same reason the promo
# video is rendered in Actions rather than locally.
#
# Run it from the Actions tab, choose "Build Android APK", press "Run workflow",
# and paste the live site URL. The APK lands under the run's Artifacts.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Live TrustFirst URL the app should load (e.g. https://trustfirst.onrender.com)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install

      - name: Point the shell at the live site
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server.url = process.env.APP_URL;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            console.log('Loading:', cfg.server.url);
          "

      - name: Add the Android platform
        run: npx cap add android

      - name: Add Firebase config for push
        # Repo secret GOOGLE_SERVICES_JSON holds the contents of google-services.json
        # from the Firebase console. Without it the app still builds and runs, it
        # just cannot receive push notifications.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written, push enabled"
          else
            echo "No GOOGLE_SERVICES_JSON secret set, building without push"
          fi

      - name: Sync
        run: npx cap sync android

      - name: Build the debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: trustfirst-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
